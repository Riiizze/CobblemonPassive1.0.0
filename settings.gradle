pluginManagement {
    repositories {
        mavenLocal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'CobblemonPassive'

include 'common'
include 'neoforge'
include 'fabric'
